# Pokémon Hub front door on macserver. Listens on localhost:80 only; the Cloudflare tunnel
# (pktrade.aidenpearce.space, HTTP to localhost:80) forwards here, so no port shows publicly. A deploy changes only pokehub-upstream.conf (see pokehub-flip).

# Upgrade the Socket.IO websocket and keep plain HTTP working.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 127.0.0.1:80;
  server_name pktrade.aidenpearce.space _;
  client_max_body_size 2m;   # the largest save is 512 KB; leave room for JSON

  location / {
    proxy_pass http://pokehub_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Link sessions and the admin bot view hold websockets open for hours.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
