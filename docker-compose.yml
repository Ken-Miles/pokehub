# Local backing services. The web app and worker run on the host (npm run dev / dev:worker),
# like Stork. Everything binds to 127.0.0.1 only.
name: pokehub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pokehub
      POSTGRES_PASSWORD: pokehub
      POSTGRES_DB: pokehub
    ports: ["127.0.0.1:5433:5432"] # 5433 so it never clashes with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokehub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  # S3-compatible stand-in for Cloudflare R2 (SeaweedFS; MinIO no longer publishes images).
  # No identities configured = no auth, dev only. The app creates the bucket on first use.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -volume.max=0
    ports: ["127.0.0.1:9000:8333"]
    volumes: [s3data:/data]

  # .NET + PKHeX.Core. Stateless, read-only filesystem, no capabilities.
  # Dev publishes it on localhost so the host-run app can reach it. Production runs it with
  # network_mode: none and LISTEN_SOCKET (unix socket) — see docs/design.md (NFR-04).
  save-service:
    build: ./save-service
    image: pokehub-save-service:dev
    ports: ["127.0.0.1:5080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # FR-38 DS network tunnel (Phase 5): docker compose --profile ds up -d ds-gateway.
  # Each tunnel is a tap on a private bridge; ip_forward=0 keeps DS traffic off every other network.
  ds-gateway:
    build: ./ds-gateway
    image: pokehub-ds-gateway:dev
    profiles: [ds]
    environment:
      DS_GATEWAY_SECRET: ${DS_GATEWAY_SECRET:?set DS_GATEWAY_SECRET in .env}
      # FR-39: the site, for sign-in checks (/api/ds/signin). Dev: the app on the host.
      DS_SITE_URL: ${DS_SITE_URL:-http://host.docker.internal:3000}
    ports: ["127.0.0.1:8790:8790"]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: 0
      net.ipv6.conf.all.disable_ipv6: 1 # the DS speaks IPv4 only; no IPv6 chatter on the bridge
      net.ipv6.conf.default.disable_ipv6: 1

  # FR-39: sign-in + GameSpy services (dwc_network_server_emulator) and the HTTP front for
  # them, both inside ds-gateway's network so DSes reach them at 10.77.0.1. Restart them
  # after restarting ds-gateway (they join its network namespace).
  ds-services:
    build: ./ds-gateway/dwc
    image: pokehub-ds-services:dev
    profiles: [ds]
    network_mode: service:ds-gateway
    depends_on: [ds-gateway]
    volumes: [dsdata:/dwc/data]

  ds-web:
    image: nginx:1.27-alpine
    profiles: [ds]
    network_mode: service:ds-gateway
    depends_on: [ds-services]
    volumes: ["./ds-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]

volumes:
  dsdata:
  pgdata:
  s3data:
