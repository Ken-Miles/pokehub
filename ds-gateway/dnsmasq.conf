# FR-38: DHCP and DNS for the DS virtual network (bridge br0, 10.77.0.0/16).
interface=br0
bind-interfaces
log-queries
log-dhcp
log-facility=-
# Nothing outside the virtual network: no upstream resolvers, unknown names fail.
no-resolv
no-hosts
# Only DSes live on the bridge, so skip the ping-before-offer check (it delays a new DS ~3 s).
no-ping
dhcp-range=10.77.1.0,10.77.255.254,255.255.0.0,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
# Nintendo Wi-Fi Connection names (nas, conntest, GameSpy *.gs.nintendowifi.net) → us.
address=/nintendowifi.net/10.77.0.1
address=/nintendo.net/10.77.0.1
