# FR-39: the Nintendo HTTP names on the DS bridge (10.77.0.1:80), by Host, to the dwc
# services on 127.0.0.1 (ds-gateway/dwc). Same mapping as dwc's tools/apache-hosts.
map $host $dwc {
    default                         127.0.0.1:9000; # nas, naswii, conntest
    gamestats.gs.nintendowifi.net   127.0.0.1:9002;
    gamestats2.gs.nintendowifi.net  127.0.0.1:9002;
    dls1.nintendowifi.net           127.0.0.1:9003;
    ~sake\.gs\.nintendowifi\.net$   127.0.0.1:8000;
}

server {
    listen 80 default_server;
    client_max_body_size 1m;
    access_log /dev/stdout;
    # Sign-in goes through the gateway's account check first (gateway.py Signin), then to nas.
    location = /ac {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://$dwc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
